name: Deploy curso a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite correrlo manualmente desde GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.43"

      - name: Build con mdBook
        run: mdbook build

      - name: Upload artifact para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: book-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
